version: "3.8"

services:
  # One-shot init service: downloads data + trains model into shared volumes
  trainer:
    build: .
    container_name: heart_trainer
    command: ["sh", "-c", "python scripts/download_data.py --out data/heart.csv && python -m src.train"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - DATA_PATH=data/heart.csv
      - MODEL_DIR=models
      - MLFLOW_EXPERIMENT=heart-disease-exp
    restart: "no"

  api:
    build: .
    container_name: heart_api
    depends_on:
      trainer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns
    environment:
      - MODEL_DIR=models
    restart: unless-stopped

  streamlit:
    build: .
    container_name: heart_streamlit
    depends_on:
      - api
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_DIR=models
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: heart_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: heart_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
