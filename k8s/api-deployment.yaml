apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      volumes:
        - name: model-vol
          emptyDir: {}
        - name: data-vol
          emptyDir: {}
      initContainers:
        - name: init-download-and-train
          image: heart-mlops:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_PATH
              value: /data/heart.csv
            - name: MODEL_DIR
              value: /models
            - name: MLFLOW_EXPERIMENT
              value: heart-disease-exp
          volumeMounts:
            - name: model-vol
              mountPath: /models
            - name: data-vol
              mountPath: /data
          command: ["sh", "-c"]
          args:
            - |
              python scripts/download_data.py --out /data/heart.csv
              python -m src.train
              ls -lh /models
      containers:
        - name: api
          image: heart-mlops:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_DIR
              value: /models
          volumeMounts:
            - name: model-vol
              mountPath: /models
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api-svc
spec:
  selector:
    app: heart-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
