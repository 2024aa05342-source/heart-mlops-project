name: Heart-MLops-CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (fail on issues)
        run: |
          flake8 src tests

      - name: Run tests
        run: |
          pytest -q

      - name: Train model (creates joblib + json)
        run: |
          python scripts/download_data.py --out data/heart.csv
          python -m src.train

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model_artifacts
          path: |
            models/*.joblib
            models/*.json
            mlruns/**/*
