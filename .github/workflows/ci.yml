name: Heart-MLops-CI-Pipeline

on:
  push:
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # ✅ Task 5 requirement: lint must fail the pipeline if violations exist
      - name: Lint
        run: |
          flake8 src tests

      - name: Run Tests
        run: |
          pytest -q

      # ✅ Train model in CI (creates models/model_pipeline.joblib + meta json)
      - name: Train Model and Save Artifacts
        run: |
          python -m src.train

      # Upload correct artifacts (joblib + json). Keep pkl too if any remain.
      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained_model_artifacts
          path: |
            models/*.joblib
            models/*.json
            models/*.pkl
